name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build et tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build et tests unitaires
        run: ./mvnw -B verify

      - name: Classement des dépêches
        run: java -jar target/comparaison-algorithmique-1.0.0.jar
